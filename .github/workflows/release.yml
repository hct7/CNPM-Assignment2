name: Release and deploy to Vercel
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  deployments: write
jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy-production:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_PRODUCTION_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      API_PRODUCTION_URL: ${{ vars.API_PRODUCTION_URL }}
      WEB_PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$API_PROJECT_ID"
          test -n "$WEB_PROJECT_ID"
          test -n "$API_PRODUCTION_URL"
          test -n "$WEB_PRODUCTION_URL"
      - name: Install Vercel CLI
        run: npm install --global vercel@48.4.0
      - name: Deploy API and web, smoke test, rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          api_deployed=0
          web_deployed=0
          rollback() {
            status=$?
            if [[ "$status" -ne 0 ]]; then
              echo "Release failed; rolling back deployed Vercel projects" >&2
              if [[ "$web_deployed" -eq 1 ]]; then
                (cd apps/web && vercel rollback --non-interactive --token="$VERCEL_TOKEN") || true
              fi
              if [[ "$api_deployed" -eq 1 ]]; then
                (cd apps/api && vercel rollback --non-interactive --token="$VERCEL_TOKEN") || true
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT

          (cd apps/api && \
            VERCEL_PROJECT_ID="$API_PROJECT_ID" vercel pull --yes --environment=production --token="$VERCEL_TOKEN" && \
            VERCEL_PROJECT_ID="$API_PROJECT_ID" vercel build --prod --token="$VERCEL_TOKEN" && \
            VERCEL_PROJECT_ID="$API_PROJECT_ID" vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          api_deployed=1

          (cd apps/web && \
            VERCEL_PROJECT_ID="$WEB_PROJECT_ID" vercel pull --yes --environment=production --token="$VERCEL_TOKEN" && \
            VERCEL_PROJECT_ID="$WEB_PROJECT_ID" vercel build --prod --token="$VERCEL_TOKEN" && \
            VERCEL_PROJECT_ID="$WEB_PROJECT_ID" vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          web_deployed=1

          for attempt in $(seq 1 18); do
            if curl --silent --show-error --fail "$API_PRODUCTION_URL/health" >/dev/null && \
              curl --silent --show-error --fail "$WEB_PRODUCTION_URL/" >/dev/null; then
              echo "Production smoke tests passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production smoke tests failed" >&2
          exit 1

      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
