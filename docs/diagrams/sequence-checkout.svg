<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">BrewLite UC-01 sequence diagram</title><desc id="desc">Checkout request through Next.js, NestJS, PostgreSQL and mock payment service, including failure and idempotency branches.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#355d49"/></marker><marker id="return" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#79867d"/></marker></defs>
<rect width="1120" height="840" fill="#fbfaf6"/><text x="560" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263b30">UC-01 · Đặt và thanh toán đơn hàng</text>
<g font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#263b30"><rect x="45" y="65" width="150" height="48" rx="8" fill="#e8efe8"/><text x="120" y="94">Customer</text><rect x="260" y="65" width="160" height="48" rx="8" fill="#e8efe8"/><text x="340" y="94">Next.js UI</text><rect x="485" y="65" width="160" height="48" rx="8" fill="#e8efe8"/><text x="565" y="94">NestJS API</text><rect x="710" y="65" width="160" height="48" rx="8" fill="#e8efe8"/><text x="790" y="94">PostgreSQL</text><rect x="930" y="65" width="150" height="48" rx="8" fill="#e8efe8"/><text x="1005" y="94">Payment mock</text></g>
<g stroke="#aab4aa" stroke-dasharray="5 6"><path d="M120 113V810M340 113V810M565 113V810M790 113V810M1005 113V810"/></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#263b30" stroke="#355d49" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M120 145H340"/><path d="M340 184H565"/><path d="M565 223H565"/><path d="M565 262H790"/><path d="M790 301H565" marker-end="url(#return)"/><path d="M565 340H790"/><path d="M790 379H565" marker-end="url(#return)"/><path d="M565 418H340" marker-end="url(#return)"/><path d="M340 457H565"/><path d="M565 496H790"/><path d="M790 535H565" marker-end="url(#return)"/><path d="M565 574H1005"/><path d="M1005 613H565" marker-end="url(#return)"/><path d="M565 652H790"/><path d="M790 691H565" marker-end="url(#return)"/><path d="M565 730H340" marker-end="url(#return)"/><path d="M340 769H120" marker-end="url(#return)"/></g>
<g font-family="Arial,sans-serif" font-size="11" fill="#43554a"><text x="225" y="138" text-anchor="middle">Giỏ + phương thức</text><text x="452" y="177" text-anchor="middle">POST /orders · JWT · key</text><text x="610" y="216">Verify JWT · validate DTO</text><text x="678" y="255" text-anchor="middle">BEGIN · đọc giá/tồn, khóa hàng</text><text x="678" y="294" text-anchor="middle">Giá + tồn hiện hành</text><text x="678" y="333" text-anchor="middle">Tạo Order/items, trừ tồn, COMMIT</text><text x="678" y="372" text-anchor="middle">orderId + total</text><text x="452" y="411" text-anchor="middle">201 · PENDING_PAYMENT</text><text x="452" y="450" text-anchor="middle">POST /orders/{id}/pay · key</text><text x="678" y="489" text-anchor="middle">Tra cứu payment theo key</text><text x="678" y="528" text-anchor="middle">Kết quả cũ nếu đã xử lý</text><text x="785" y="567" text-anchor="middle">chargeMock(order,total,key)</text><text x="785" y="606" text-anchor="middle">SUCCESS hoặc FAILED</text><text x="678" y="645" text-anchor="middle">Lưu trạng thái; FAILED hoàn tồn một lần</text><text x="678" y="684" text-anchor="middle">Kết quả idempotent</text><text x="452" y="723" text-anchor="middle">Xác nhận hoặc lỗi</text><text x="225" y="762" text-anchor="middle">Thông báo cho khách</text></g>
<rect x="500" y="780" width="580" height="40" rx="6" fill="#f3e6d7"/><text x="790" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#694e39">Nhánh lỗi: thiếu JWT / dữ liệu sai → 401/400; hết hàng → rollback + 409; payment fail → ghi FAILED + hoàn tồn.</text>
